project_root: "/home/{{ ansible_user }}/app"
env_type: development
service_name: backend

supported_env_types:
  - development
  - staging

updatable_services:
  - frontend
  - backend

env_files:
  - { src: "{{ playbook_dir }}/templates/backend.env.j2", dest: "backend.env" }
  - { src: "{{ playbook_dir }}/templates/database.env.j2", dest: "database.env" }
  - { src: "{{ playbook_dir }}/templates/nginx.env.j2", dest: "nginx.env" }
