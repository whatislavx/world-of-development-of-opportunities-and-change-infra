---
- name: "FS: Project directory"
  ansible.builtin.file:
    path: "{{ project_root }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: "Configs: Deployment files"
  block:
    - name: "Render environment files"
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ project_root }}/{{ item.dest }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      loop: "{{ env_files }}"

    - name: "Copy docker-compose infra config"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/{{ env_type }}/docker-compose.infra.yml"
        dest: "{{ project_root }}/docker-compose.infra.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    - name: "Copy docker-compose app config"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/{{ env_type }}/docker-compose.app.yml"
        dest: "{{ project_root }}/docker-compose.app.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    - name: "Copy docker-compose monitoring config"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/{{ env_type }}/docker-compose.monitoring.yml"
        dest: "{{ project_root }}/docker-compose.monitoring.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      when: env_type == 'staging'

    - name: "Copy nginx config"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/nginx/nginx.conf"
        dest: "{{ project_root }}/nginx.conf"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    - name: "Copy monitoring configs (prometheus, alerts, loki, promtail)"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/monitoring/{{ item }}"
        dest: "{{ project_root }}/{{ item }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      loop:
        - prometheus.yml
        - alert-rules.yml
        - loki-config.yaml
        - promtail-config.yaml
      when: env_type == 'staging'

    - name: "Copy Grafana provisioning"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/monitoring/grafana/provisioning/"
        dest: "{{ project_root }}/grafana/provisioning/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
        directory_mode: "0755"
      when: env_type == 'staging'

- name: "Deploy: Validate service selection"
  ansible.builtin.assert:
    that:
      - service_name == "all" or service_name in updatable_services
    fail_msg: "service_name must be one of: all, {{ updatable_services | join(', ') }}"

- name: "Deploy: Resolve compose arguments"
  ansible.builtin.set_fact:
    compose_service_args: "{{ '' if service_name == 'all' else ' ' ~ service_name }}"
    compose_no_deps: "{{ '' if service_name == 'all' else ' --no-deps' }}"
    compose_files: "{{ '-f docker-compose.infra.yml -f docker-compose.app.yml' if env_type == 'development' else '-f docker-compose.infra.yml -f docker-compose.app.yml -f docker-compose.monitoring.yml' }}"

- name: "Docker: Create network"
  ansible.builtin.command: "docker network create wdoc-network"
  register: docker_network_create
  changed_when: docker_network_create.rc == 0
  failed_when: false

- name: "Deploy: Docker Compose"
  block:
    - name: "Docker: Capture state"
      ansible.builtin.shell: "docker compose {{ compose_files }} ps -q"
      args:
        chdir: "{{ project_root }}"
      register: current_containers
      changed_when: false
      failed_when: false

    - name: "Docker: Capture images for rollback"
      ansible.builtin.shell:
        "docker compose {{ compose_files }} ps -q | xargs -I {} docker inspect
        --format '{{ '{{.Name}}:{{.Image}}' }}' {}"
      args:
        chdir: "{{ project_root }}"
      register: pre_deploy_state
      when: current_containers.stdout != ""
      changed_when: false
      failed_when: false

    - name: "Docker: Pull and Up (Wait for Health)"
      ansible.builtin.shell: |
        docker compose {{ compose_files }} pull{{ compose_service_args }}
        docker compose {{ compose_files }} up -d --remove-orphans{{ compose_no_deps }} --wait --wait-timeout 300{{ compose_service_args }}
      args:
        chdir: "{{ project_root }}"

  rescue:
    - name: "Rollback: Cleanup on first deploy failure"
      ansible.builtin.shell: "docker compose {{ compose_files }} down"
      args:
        chdir: "{{ project_root }}"
      when: current_containers.stdout == ""

    - name: "Rollback: Revert to previous stable state"
      ansible.builtin.shell: "docker compose {{ compose_files }} up -d"
      args:
        chdir: "{{ project_root }}"
      when: current_containers.stdout != ""

    - name: "Rollback: Fail deployment"
      ansible.builtin.fail:
        msg: "Deployment failed healthchecks. System cleaned up or rolled back."
