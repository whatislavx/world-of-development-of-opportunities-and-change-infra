---
- name: "FS: Project directory"
  ansible.builtin.file:
    path: "{{ project_root }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: "Configs: Deployment files"
  block:
    - name: "Render environment files"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/{{ item.src }}"
        dest: "{{ project_root }}/{{ item.dest }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      loop:
        - src: "backend.env.j2"
          dest: "backend.env"
        - src: "database.env.j2"
          dest: "database.env"

    - name: "Render nginx config"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/nginx.conf.j2"
        dest: "{{ project_root }}/nginx.conf"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    - name: "Copy docker-compose config"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/{{ env_type }}/docker-compose.yml"
        dest: "{{ project_root }}/docker-compose.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"

    - name: "Copy docker-compose monitoring app override config"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker/{{ env_type }}/docker-compose.monitoring.yml"
        dest: "{{ project_root }}/docker-compose.monitoring.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      when: env_type == 'staging'

    - name: "Copy core monitoring infrastructure docker-compose config"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/docker-compose.yml"
        dest: "{{ project_root }}/docker-compose.infra-monitoring.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      when: env_type == 'staging'

    - name: "Copy monitoring configs (prometheus, alerts, loki, promtail)"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/{{ item }}"
        dest: "{{ project_root }}/{{ item }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
      loop:
        - prometheus.yml
        - alert-rules.yml
        - loki-config.yaml
        - promtail-config.yaml
      when: env_type == 'staging'

    - name: "Copy Grafana provisioning"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../monitoring/grafana/provisioning/"
        dest: "{{ project_root }}/grafana/provisioning/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
        directory_mode: "0755"
      when: env_type == 'staging'

- name: "Deploy: Validate service selection"
  ansible.builtin.assert:
    that:
      - service_name == "all" or service_name in updatable_services
    fail_msg: "service_name must be one of: all, {{ updatable_services | join(', ') }}"

- name: "Deploy: Resolve compose arguments"
  ansible.builtin.set_fact:
    compose_service_args: "{{ '' if service_name == 'all' else ' ' ~ service_name }}"
    compose_no_deps: "{{ '' if service_name == 'all' else ' --no-deps' }}"
    app_compose_files: "{{ '-f docker-compose.yml' if env_type == 'development' else '-f docker-compose.yml -f docker-compose.monitoring.yml' }}"
    infra_compose_files: "-f docker-compose.infra-monitoring.yml"

- name: "Deploy: Infrastructure Monitoring (Staging Only)"
  block:
    - name: "Docker Infra: Pull and Up core monitoring tools"
      ansible.builtin.shell: |
        docker compose {{ infra_compose_files }} pull
        docker compose {{ infra_compose_files }} up -d --remove-orphans
      args:
        chdir: "{{ project_root }}"
  when: env_type == 'staging'

- name: "Deploy: Application Docker Compose Stack"
  block:
    - name: "Docker App: Capture state"
      ansible.builtin.shell: "docker compose {{ app_compose_files }} ps -q"
      args:
        chdir: "{{ project_root }}"
      register: current_containers
      changed_when: false
      failed_when: false

    - name: "Docker App: Capture images for rollback"
      ansible.builtin.shell: |
        docker compose {{ app_compose_files }} ps -q | xargs -I {} docker inspect --format '{{ '{{' }}.Name{{ '}}' }}:{{ '{{' }}.Image{{ '}}' }}' {}
      args:
        chdir: "{{ project_root }}"
      register: pre_deploy_state
      when: current_containers.stdout != ""
      changed_when: false
      failed_when: false

    - name: "Docker App: Pull and Up (Wait for Health)"
      ansible.builtin.shell: |
        docker compose {{ app_compose_files }} pull{{ compose_service_args }}
        docker compose {{ app_compose_files }} up -d --remove-orphans{{ compose_no_deps }} --wait --wait-timeout 300{{ compose_service_args }}
      args:
        chdir: "{{ project_root }}"

  rescue:
    - name: "Rollback: Cleanup on first deploy failure"
      ansible.builtin.shell: "docker compose {{ app_compose_files }} down"
      args:
        chdir: "{{ project_root }}"
      when: current_containers.stdout == ""

    - name: "Rollback: Revert to previous stable state"
      ansible.builtin.shell: "docker compose {{ app_compose_files }} up -d"
      args:
        chdir: "{{ project_root }}"
      when: current_containers.stdout != ""

    - name: "Rollback: Fail deployment"
      ansible.builtin.fail:
        msg: "Deployment failed healthchecks. System cleaned up or rolled back."
