# Infrastructure services (database, cache)
# These services are less frequently restarted

services:
  db:
    image: postgres:15-alpine
    container_name: wdoc-db
    restart: always
    env_file: ./database.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wdoc-network

  redis:
    image: redis:alpine
    container_name: wdoc-redis-development
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - wdoc-network

networks:
  wdoc-network:
    driver: bridge

volumes:
  postgres_data:
