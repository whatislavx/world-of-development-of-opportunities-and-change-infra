# Staging services (app + infra)

services:
  redis:
    image: redis:alpine
    container_name: wdoc-redis-staging
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - wdoc-network

  backend:
    image: whatislavx/wdoc-backend-staging:latest
    container_name: wdoc-backend-staging
    env_file: ./backend.env
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wdoc-network

  celery:
    image: whatislavx/wdoc-backend-staging:latest
    container_name: celery_staging
    command: celery -A config worker --loglevel=info
    env_file: ./backend.env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - wdoc-network

  frontend:
    image: whatislavx/wdoc-frontend-staging:latest
    container_name: wdoc-frontend-staging
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - wdoc-network

  nginx:
    image: nginx:stable-alpine
    container_name: wdoc-nginx-staging
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    env_file: ./nginx.env
    volumes:
      - ./nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - wdoc-network

networks:
  wdoc-network:
    driver: bridge

volumes:
  static_volume:
  media_volume:
