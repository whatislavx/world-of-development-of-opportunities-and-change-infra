# Infrastructure services (cache)
# In staging, database is typically managed externally (RDS, etc.)

services:
  redis:
    image: redis:alpine
    container_name: wdoc-redis-staging
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - wdoc-network

networks:
  wdoc-network:
    driver: bridge
