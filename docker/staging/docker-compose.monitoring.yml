# Monitoring services for staging environment
# Includes: Prometheus, Grafana, Loki, Promtail, Node Exporter

services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-staging
    restart: always
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    expose:
      - 9100

  promtail:
    image: grafana/promtail:latest
    container_name: promtail-staging
    restart: always
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /tmp:/tmp
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - wdoc-network

  loki:
    image: grafana/loki:2.9.4
    container_name: loki-staging
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    networks:
      - wdoc-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-staging
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    networks:
      - wdoc-network


networks:
  wdoc-network:
    external: true

