# Monitoring services for staging environment

services:
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-staging
    restart: always
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - wdoc-network
    deploy:
      resources:
        limits:
          memory: 50M
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor-staging
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - wdoc-network
    command:
      - '-housekeeping_interval=30s'
      - '-docker_only=true'
    deploy:
      resources:
        limits:
          memory: 150M
    logging: *default-logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter-staging
    restart: always
    command:
      - -nginx.scrape-uri=http://nginx:8081/nginx_status
    depends_on:
      - nginx
    networks:
      - wdoc-network
    deploy:
      resources:
        limits:
          memory: 30M
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail-staging
    restart: always
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /tmp:/tmp
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - wdoc-network
    deploy:
      resources:
        limits:
          memory: 100M
    logging: *default-logging

  loki:
    image: grafana/loki:3.0.0
    container_name: loki-staging
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data_staging:/loki
    networks:
      - wdoc-network
    deploy:
      resources:
        limits:
          memory: 300M
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=24h'
      - '--storage.tsdb.retention.size=1600MB'
      - '--storage.tsdb.wal-compression'
    ports:
      - "9090:9090"
    networks:
      - wdoc-network
    deploy:
      resources:
        limits:
          memory: 500M
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana-staging
    restart: always
    env_file:
      - ./backend.env
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data_staging:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - wdoc-network
    deploy:
      resources:
        limits:
          memory: 250M
    logging: *default-logging

networks:
  wdoc-network:
    external: true

volumes:
  grafana_data_staging:
  prometheus_data:
  loki_data_staging: