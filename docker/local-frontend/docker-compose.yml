version: "3.8"
services:
  frontend:
    build:
      context: ../../world-of-development-of-opportunities-and-change-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wdoc-network

  backend:
    image: whatislavx/wdoc-backend-dev:latest
    env_file: ../../backend.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - wdoc-network

  celery:
    image: whatislavx/wdoc-backend-dev:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    env_file: ../../backend.env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wdoc-network

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: ../../database.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wdoc-network

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - wdoc-network

networks:
  wdoc-network:
    driver: bridge

volumes:
  postgres_data:
